app = "mai-reel-extractor"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  MAX_DURATION = "3600"
  RATE_PER_MIN = "20"
  # tighten this to your own site once it is deployed
  ALLOW_ORIGIN = "*"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
